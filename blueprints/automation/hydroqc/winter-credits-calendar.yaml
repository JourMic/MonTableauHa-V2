blueprint:
  name: Hydro-Québec Crédits Hivernaux (Événements de calendrier)
  description: "# Gestion automatisée des Crédits Hivernaux (D+CPC).\n\nCe blueprint
    déclenche des automatisations à heures fixes pour les périodes de pointe et d'ancrage,
    puis vérifie le calendrier Hydro-Québec pour déterminer si c'est une pointe critique
    ou régulière et exécute les actions appropriées.\n\n**Fonctionnement** : \n- Déclencheurs
    à heures fixes pour ancrage et pointes (01h, 04h, 06h, 10h, 12h, 14h, 16h, 20h)\n-
    Déclencheurs calendrier avec offset pour pré-chauffage (par défaut -01:45:00 avant
    pointes critiques)\n- Vérifie automatiquement si un événement critique existe
    dans le calendrier\n- Exécute les actions critiques (si événement calendrier)
    ou régulières (horaire quotidien)\n- Le pré-chauffage se déclenche automatiquement
    via les événements calendrier (pointes critiques uniquement)\n\n**Prérequis**
    : Vous devez avoir configuré un calendrier dans les options de votre intégration
    Hydro-Québec D+CPC (Crédits Hivernaux).\n\n## Configuration\n\n### Sélection du
    calendrier\n\nSélectionnez le calendrier configuré dans l'intégration Hydro-Québec.
    Le calendrier contient uniquement les pointes **critiques** annoncées par Hydro-Québec.\n\n###
    Pré-chauffage (pointes critiques seulement)\n\nConfigurez le délai avant les pointes
    critiques pour commencer le pré-chauffage. Utilise les événements du calendrier
    avec un offset.\n- Par défaut : -01:45:00 (1h45 avant le début de la pointe critique)\n-
    Le pré-chauffage se déclenche automatiquement UNIQUEMENT pour les événements critiques
    dans le calendrier\n\n### Horaire quotidien (pointes régulières)\n\nLes pointes
    régulières suivent un horaire fixe pendant la saison hivernale (1er décembre au
    31 mars) :\n- **Ancrage matin** : 01h-04h (établit consommation de référence)\n-
    **Pointe matin** : 06h-10h\n- **Ancrage soir** : 12h-14h (établit consommation
    de référence)\n- **Pointe soir** : 16h-20h\n\n### Pointes critiques\n\nHydro-Québec
    annonce les pointes critiques vers midi la veille. Ces événements apparaissent
    dans votre calendrier et remplacent les actions régulières pour cette journée.\n\n###
    Actions\n\nDéfinissez vos actions pour chaque période. Le blueprint choisit automatiquement
    entre actions critiques et régulières selon la présence d'un événement calendrier.\n\n**Important**
    : Pour éviter qu'une erreur bloque l'exécution, utilisez des actions en parallèle
    (`parallel:`).\n\n**Pré-chauffage** : Pour pré-chauffer avant les pointes critiques,
    ajoutez la logique dans l'action \"début pointe critique\" ou créez une automatisation
    séparée.\n\n### Création manuelle d'événements\n\nSi l'intégration ne crée pas
    automatiquement les événements (API indisponible, problème de configuration),
    vous pouvez les créer en utilisant le service `hydroqc.create_peak_event` avec
    la date et le créneau (AM ou PM).\n\n\nPlus de détails sur les [crédits hivernaux](https://hydroqc.ca/fr/docs/tarification-dynamique/).\n"
  domain: automation
  input:
    hydroqc_calendar:
      name: Calendrier Hydro-Québec
      description: Sélectionnez le calendrier configuré dans l'intégration Hydro-Québec
        pour les événements de pointe
      selector:
        entity:
          domain:
          - calendar
          multiple: false
          reorder: false
    preheat_offset_morning:
      name: Délai de pré-chauffage (matin)
      description: 'Temps avant le début de la pointe du matin pour commencer le pré-chauffage
        (format -HH:MM:SS, ex: -02:00:00 pour 2 heures avant, -01:45:00 pour 1h45
        avant)'
      default: -01:45:00
      selector:
        text:
          type: text
          multiline: false
          multiple: false
    preheat_offset_evening:
      name: Délai de pré-chauffage (soir)
      description: 'Temps avant le début de la pointe du soir pour commencer le pré-chauffage
        (format -HH:MM:SS, ex: -02:00:00 pour 2 heures avant, -01:45:00 pour 1h45
        avant)'
      default: -01:45:00
      selector:
        text:
          type: text
          multiline: false
          multiple: false
    critical_preheat_morning_action:
      name: '[Critique] Action pré-chauffage (matin)'
      description: 'Actions pour pointes CRITIQUES - pré-chauffage avant pointe matin.
        Ex: Maximisez chauffage pour atteindre température élevée. Ne se déclenche
        QUE si un événement critique existe dans le calendrier pour aujourd''hui.'
      default:
      - parallel:
        - action: persistent_notification.create
          data:
            title: "\U0001F525 Pré-chauffage Crédits hivernaux (matin)"
            message: Début du pré-chauffage avant pointe critique du matin. Augmentez
              le chauffage maintenant.
      selector:
        action: {}
    critical_preheat_evening_action:
      name: '[Critique] Action pré-chauffage (soir)'
      description: 'Actions pour pointes CRITIQUES - pré-chauffage avant pointe soir.
        Ex: Maximisez chauffage pour atteindre température élevée. Ne se déclenche
        QUE si un événement critique existe dans le calendrier pour aujourd''hui.'
      default:
      - parallel:
        - action: persistent_notification.create
          data:
            title: "\U0001F525 Pré-chauffage Crédits hivernaux (soir)"
            message: Début du pré-chauffage avant pointe critique du soir. Augmentez
              le chauffage maintenant.
      selector:
        action: {}
    critical_peak_start_action:
      name: '[Critique] Action début pointe'
      description: 'Actions pour pointes CRITIQUES - début pointe (6h/16h). Ex: Réduction
        agressive - fermez chauffe-eau, minimisez CVAC. Le pré-chauffage est géré
        séparément via les actions de pré-chauffage configurables.'
      default:
      - parallel:
        - action: persistent_notification.create
          data:
            title: "\U0001F534 Pointe critique Crédits hivernaux"
            message: Début de la pointe critique. Réduisez votre consommation maintenant.
      selector:
        action: {}
    critical_peak_end_action:
      name: '[Critique] Action fin pointe'
      description: 'Actions pour pointes CRITIQUES - fin pointe (10h/20h). Ex: Rétablissez
        tous appareils à opération normale.


        **Délai aléatoire par défaut (30 sec - 5 min)** : Évite une surcharge du réseau
        électrique causée par le redémarrage simultané de milliers d''appareils à
        la fin de la pointe. Si vous avez plusieurs actions de reprise, ajoutez un
        délai aléatoire similaire entre chacune pour étaler la consommation.

        '
      default:
      - delay:
          seconds: '{{ range(30, 300)|random|int }}'
        alias: Délai aléatoire 30 sec - 5 minutes
      - parallel:
        - action: persistent_notification.create
          data:
            title: ✅ Fin pointe critique Crédits hivernaux
            message: Fin de la pointe critique. Vous pouvez rétablir votre consommation
              normale.
      selector:
        action: {}
    regular_peak_actions:
      name: ⚪ Actions pointes régulières
      description: Actions exécutées lors des pointes quotidiennes RÉGULIÈRES (6h-10h
        et 16h-20h) quand AUCUN événement critique n'est présent dans le calendrier.
        Ces actions s'exécutent automatiquement selon l'horaire fixe hivernal.
      collapsed: true
      input:
        regular_peak_start_action:
          name: '[Régulière] Début pointe'
          description: 'Pointes RÉGULIÈRES - début pointe (6h/16h). Notification désactivée
            par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ⚪ Pointe régulière Crédits hivernaux
                message: Début de la pointe régulière. Réduction optionnelle de consommation.
          selector:
            action: {}
        regular_peak_end_action:
          name: '[Régulière] Fin pointe'
          description: 'Pointes RÉGULIÈRES - fin pointe (10h/20h). Notification désactivée
            par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ✅ Fin pointe régulière Crédits hivernaux
                message: Fin de la pointe régulière.
          selector:
            action: {}
    anchor_actions:
      name: ⚙️ Actions d'ancrage (optionnel)
      description: Les actions d'ancrage permettent d'établir une consommation de
        référence avant les pointes. Ces actions sont optionnelles.
      collapsed: true
      input:
        critical_anchor_start_morning_action:
          name: '[Critique] Début ancrage matin'
          description: 'Pointes CRITIQUES - 5h avant pointe matin (1h). Notification
            désactivée par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: "\U0001F534 Ancrage critique matin Crédits hivernaux"
                message: Début de l'ancrage critique du matin. Maintenez votre consommation
                  normale pour établir une référence.
          selector:
            action: {}
        critical_anchor_start_evening_action:
          name: '[Critique] Début ancrage soir'
          description: 'Pointes CRITIQUES - 4h avant pointe soir (12h). Notification
            désactivée par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: "\U0001F534 Ancrage critique soir Crédits hivernaux"
                message: Début de l'ancrage critique du soir. Maintenez votre consommation
                  normale pour établir une référence.
          selector:
            action: {}
        critical_anchor_end_morning_action:
          name: '[Critique] Fin ancrage matin'
          description: 'Pointes CRITIQUES - 2h avant pointe matin (4h). Fin ancrage.


            **⚠️ Attention** : Si votre délai de pré-chauffage est <= -02:00:00, il
            y aura chevauchement avec cette action. La fin d''ancrage se déclenche
            à 4h pour une pointe à 6h.


            Notification désactivée par défaut - retirez le mode `enabled: false`
            pour activer.

            '
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ✅ Fin ancrage critique matin Crédits hivernaux
                message: Fin de l'ancrage critique du matin. Préparez-vous pour le
                  pré-chauffage.
          selector:
            action: {}
        critical_anchor_end_evening_action:
          name: '[Critique] Fin ancrage soir'
          description: 'Pointes CRITIQUES - 2h avant pointe soir (14h). Fin ancrage.


            **⚠️ Attention** : Si votre délai de pré-chauffage est <= -02:00:00, il
            y aura chevauchement avec cette action. La fin d''ancrage se déclenche
            à 14h pour une pointe à 16h.


            Notification désactivée par défaut - retirez le mode `enabled: false`
            pour activer.

            '
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ✅ Fin ancrage critique soir Crédits hivernaux
                message: Fin de l'ancrage critique du soir. Préparez-vous pour le
                  pré-chauffage.
          selector:
            action: {}
        regular_anchor_start_morning_action:
          name: '[Régulière] Début ancrage matin'
          description: 'Pointes RÉGULIÈRES - 5h avant pointe matin (1h). Notification
            désactivée par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ⚙️ Ancrage matin Crédits hivernaux
                message: Début de l'ancrage du matin. Maintenez votre consommation
                  normale.
          selector:
            action: {}
        regular_anchor_start_evening_action:
          name: '[Régulière] Début ancrage soir'
          description: 'Pointes RÉGULIÈRES - 4h avant pointe soir (12h). Notification
            désactivée par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ⚙️ Ancrage soir Crédits hivernaux
                message: Début de l'ancrage du soir. Maintenez votre consommation
                  normale.
          selector:
            action: {}
        regular_anchor_end_morning_action:
          name: '[Régulière] Fin ancrage matin'
          description: 'Pointes RÉGULIÈRES - 2h avant pointe matin (4h). Notification
            désactivée par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ✅ Fin ancrage matin Crédits hivernaux
                message: Fin de l'ancrage du matin.
          selector:
            action: {}
        regular_anchor_end_evening_action:
          name: '[Régulière] Fin ancrage soir'
          description: 'Pointes RÉGULIÈRES - 2h avant pointe soir (14h). Notification
            désactivée par défaut - retirez le mode `enabled: false` pour activer.'
          default:
          - enabled: false
            parallel:
            - action: persistent_notification.create
              data:
                title: ✅ Fin ancrage soir Crédits hivernaux
                message: Fin de l'ancrage du soir.
          selector:
            action: {}
  source_url: https://github.com/hydroqc/hydroqc-ha/blob/main/blueprints/winter-credits-calendar.yaml
mode: parallel
max_exceeded: silent
trigger:
- platform: calendar
  entity_id: !input hydroqc_calendar
  event: start
  offset: !input preheat_offset_morning
  id: preheat_morning
- platform: calendar
  entity_id: !input hydroqc_calendar
  event: start
  offset: !input preheat_offset_evening
  id: preheat_evening
- platform: time
  at: 01:00:00
  id: anchor_start_morning
- platform: time
  at: 04:00:00
  id: anchor_end_morning
- platform: time
  at: 06:00:00
  id: peak_start_morning
- platform: time
  at: '10:00:00'
  id: peak_end_morning
- platform: time
  at: '12:00:00'
  id: anchor_start_evening
- platform: time
  at: '14:00:00'
  id: anchor_end_evening
- platform: time
  at: '16:00:00'
  id: peak_start_evening
- platform: time
  at: '20:00:00'
  id: peak_end_evening
condition:
- condition: template
  value_template: '{{ now().month == 12 or now().month <= 3 }}'
- condition: or
  conditions:
  - condition: template
    value_template: '{{ trigger.platform != ''calendar'' }}'
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ ''pointe'' in trigger.calendar_event.summary | lower }}'
    - condition: template
      value_template: '{{ ''Tarif: DCPC'' in trigger.calendar_event.description }}'
variables:
  calendar_entity: !input hydroqc_calendar
action:
- action: calendar.get_events
  target:
    entity_id: !input hydroqc_calendar
  data:
    start_date_time: '{{ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat()
      }}'
    end_date_time: '{{ now().replace(hour=23, minute=59, second=59, microsecond=0).isoformat()
      }}'
  response_variable: calendar_events
- variables:
    morning_peak_critical: "{{ calendar_events[calendar_entity].events \n   | selectattr('summary',
      'search', '[Pp]ointe')\n   | selectattr('description', 'search', 'Tarif: DCPC')\n
      \  | selectattr('start', 'search', now().strftime('%Y-%m-%dT06:'))\n   | list
      | length > 0 }}\n"
    evening_peak_critical: "{{ calendar_events[calendar_entity].events \n   | selectattr('summary',
      'search', '[Pp]ointe')\n   | selectattr('description', 'search', 'Tarif: DCPC')\n
      \  | selectattr('start', 'search', now().strftime('%Y-%m-%dT16:'))\n   | list
      | length > 0 }}\n"
- choose:
  - conditions:
    - condition: trigger
      id: anchor_start_morning
    - condition: template
      value_template: '{{ morning_peak_critical }}'
    sequence: !input critical_anchor_start_morning_action
  - conditions:
    - condition: trigger
      id: anchor_start_morning
    - condition: template
      value_template: '{{ not morning_peak_critical }}'
    sequence: !input regular_anchor_start_morning_action
  - conditions:
    - condition: trigger
      id: anchor_end_morning
    - condition: template
      value_template: '{{ morning_peak_critical }}'
    sequence: !input critical_anchor_end_morning_action
  - conditions:
    - condition: trigger
      id: anchor_end_morning
    - condition: template
      value_template: '{{ not morning_peak_critical }}'
    sequence: !input regular_anchor_end_morning_action
  - conditions:
    - condition: trigger
      id: preheat_morning
    - condition: template
      value_template: '{{ as_timestamp(trigger.calendar_event.start) | timestamp_custom(''%H'')
        | int < 12 }}'
    sequence: !input critical_preheat_morning_action
  - conditions:
    - condition: trigger
      id: peak_start_morning
    - condition: template
      value_template: '{{ morning_peak_critical }}'
    sequence: !input critical_peak_start_action
  - conditions:
    - condition: trigger
      id: peak_start_morning
    - condition: template
      value_template: '{{ not morning_peak_critical }}'
    sequence: !input regular_peak_start_action
  - conditions:
    - condition: trigger
      id: peak_end_morning
    - condition: template
      value_template: '{{ morning_peak_critical }}'
    sequence: !input critical_peak_end_action
  - conditions:
    - condition: trigger
      id: peak_end_morning
    - condition: template
      value_template: '{{ not morning_peak_critical }}'
    sequence: !input regular_peak_end_action
  - conditions:
    - condition: trigger
      id: anchor_start_evening
    - condition: template
      value_template: '{{ evening_peak_critical }}'
    sequence: !input critical_anchor_start_evening_action
  - conditions:
    - condition: trigger
      id: anchor_start_evening
    - condition: template
      value_template: '{{ not evening_peak_critical }}'
    sequence: !input regular_anchor_start_evening_action
  - conditions:
    - condition: trigger
      id: anchor_end_evening
    - condition: template
      value_template: '{{ evening_peak_critical }}'
    sequence: !input critical_anchor_end_evening_action
  - conditions:
    - condition: trigger
      id: anchor_end_evening
    - condition: template
      value_template: '{{ not evening_peak_critical }}'
    sequence: !input regular_anchor_end_evening_action
  - conditions:
    - condition: trigger
      id: preheat_evening
    - condition: template
      value_template: '{{ as_timestamp(trigger.calendar_event.start) | timestamp_custom(''%H'')
        | int >= 12 }}'
    sequence: !input critical_preheat_evening_action
  - conditions:
    - condition: trigger
      id: peak_start_evening
    - condition: template
      value_template: '{{ evening_peak_critical }}'
    sequence: !input critical_peak_start_action
  - conditions:
    - condition: trigger
      id: peak_start_evening
    - condition: template
      value_template: '{{ not evening_peak_critical }}'
    sequence: !input regular_peak_start_action
  - conditions:
    - condition: trigger
      id: peak_end_evening
    - condition: template
      value_template: '{{ evening_peak_critical }}'
    sequence: !input critical_peak_end_action
  - conditions:
    - condition: trigger
      id: peak_end_evening
    - condition: template
      value_template: '{{ not evening_peak_critical }}'
    sequence: !input regular_peak_end_action
