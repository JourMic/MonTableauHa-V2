- id: '1691450956712'
  alias: Allumer les lumières avants lorsque je reviens chez moi
  description: Allumer les lumières avants lorsque je reviens chez moi
  trigger:
  - platform: zone
    entity_id: device_tracker.life360_michel
    zone: zone.home
    event: enter
  condition:
  - condition: sun
    before: sunrise
    after: sunset
  action:
  - service: scene.turn_on
    target:
      entity_id: scene.exterieure_avant_concentration
    metadata: {}
  mode: single
- id: '1698099646283'
  alias: Contrôle des caméras lors de mes déplacements
  description: ''
  triggers:
  - entity_id: device_tracker.life360_michel
    zone: zone.home
    event: enter
    id: Je reviens chez moi
    trigger: zone
  - entity_id: device_tracker.life360_michel
    zone: zone.home
    event: leave
    trigger: zone
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - Je reviens chez moi
    then:
    - data:
        code: '2107'
      action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.blink_ca_exterieures
    - delay:
        hours: 0
        minutes: 0
        seconds: 15
        milliseconds: 0
    - data: {}
      action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.blink_ca_interieures
    else:
    - data:
        code: '2107'
      action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.blink_ca_exterieures
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - data:
        code: '2107'
      action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.blink_ca_interieures
  mode: single
- id: '1698187066085'
  alias: Contrôle des caméras
  description: Activer les caméras à 23h00 et désactiver les caméras intérieures à
    06h30
  triggers:
  - at: '23:00:00'
    id: Activer les caméras le soir
    trigger: time
  - at: 06:30:00
    trigger: time
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - Activer les caméras le soir
    then:
    - data:
        code: '2107'
      action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.blink_ca_exterieures
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - data:
        code: '2107'
      action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.blink_ca_interieures
    else:
    - data:
        code: '2107'
      action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.blink_ca_interieures
  mode: single
- id: '1701020240452'
  alias: Allumer les lumières de Noël
  description: ''
  triggers:
  - event: sunset
    offset: 00:15:00
