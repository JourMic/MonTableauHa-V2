  mode: single
- id: '202966252317'
  alias: Life360 - Mise à jour de la position de Michel
  description: Augmenter la fréquence de mise à jour quand Michel est proche de la
    maison
  trigger:
  - platform: template
    value_template: '{% set state = states.device_tracker.life360_michel %}

      {{ state is not none and state.attributes.driving and distance(state) < 1 }}'
  condition: []
  action:
  - repeat:
      sequence:
      - service: life360.update_location
        metadata: {}
        data: {}
        target:
          entity_id: device_tracker.life360_michel
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      while:
      - condition: template
        value_template: '{% set state = states.device_tracker.life360_michel %}

          {{ state is not none and state.attributes.driving and distance(state) <
          1 }}'
  mode: restart
- id: '1732054779542'
  alias: Contrôles des défis Hilo
  description: Mettre les appareils dans le bon états selon le statut Hilo
  triggers:
  - trigger: state
    entity_id:
    - sensor.defi_hilo
    to: pre_heat
    id: Défi Hilo pre_heat
  - trigger: state
    entity_id:
    - sensor.defi_hilo
    to: reduction
    id: Défi Hilo reduction
  - trigger: state
    entity_id:
    - sensor.defi_hilo
    to: recovery
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - Défi Hilo pre_heat
    then:
    - action: climate.set_temperature
      metadata: {}
      data:
        temperature: 23
      target:
        entity_id:
        - climate.sensibo_cuisine
        - climate.sensibo_salle_de_repos
    - action: notify.mobile_app_iphone
      metadata: {}
      data:
        message: 'Hilo - Début de la période de pré-chauffage '
        title: Événement Hilo
    else:
    - if:
      - condition: trigger
        id:
        - Défi Hilo reduction
      then:
      - action: climate.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - climate.sensibo_cuisine
          - climate.sensibo_salle_de_repos
      - action: switch.turn_off
        metadata: {}
        target:
          entity_id: switch.neviweb130_switch_prise_echangeur_dair
        data: {}
      - action: notify.mobile_app_iphone
        metadata: {}
        data:
          message: Hilo - Début de la période de réduction
          title: Événement Hilo
      else:
      - action: climate.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - climate.sensibo_cuisine
          - climate.sensibo_salle_de_repos
      - action: climate.set_temperature
        metadata: {}
        data:
          temperature: 21
        target:
          entity_id:
          - climate.sensibo_cuisine
          - climate.sensibo_salle_de_repos
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.neviweb130_switch_prise_echangeur_dair
        data: {}
      - action: notify.mobile_app_iphone
        metadata: {}
        data:
          message: Hilo - Début de la période de reprise
          title: Événement Hilo
  mode: single
