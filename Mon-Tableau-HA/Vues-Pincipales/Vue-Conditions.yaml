title: Conditions
path: Vue-Conditions
icon: mdi:home-analytics
subview: false
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: Salon
        heading_style: title
        icon: mdi:home-search
        grid_options:
          columns: 12
          rows: 0.7

      - type: custom:netatmo-card
        module_type: indoor
        entity: sensor.maison_temperature
        name: Salon
        humidity_entity: sensor.maison_humidite
        co2_entity: sensor.maison_dioxyde_de_carbone
        noise_entity: sensor.maison_bruit
        pressure_entity: sensor.maison_pression_atmospherique
        trend_entity: sensor.maison_tendance_de_la_temperature
        connectivity_entity: binary_sensor.maison_connectivite
        grid_options:
          rows: auto
          columns: 12
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre);
            }

      - type: heading
        heading: Bureau
        heading_style: title
        icon: mdi:home-search
        grid_options:
          columns: 6
          rows: 0.3
        visibility:
          - condition: screen
            media_query: "(min-width: 768px)"

      - type: heading
        heading: Sous-Sol
        heading_style: title
        icon: mdi:home-search
        grid_options:
          columns: 6
          rows: 0.3
        visibility:
          - condition: screen
            media_query: "(min-width: 768px)"

      - type: custom:netatmo-card
        module_type: indoor_extra
        entity: sensor.maison_bureau_temperature
        name: Bureau
        humidity_entity: sensor.maison_bureau_humidite
        co2_entity: sensor.maison_bureau_dioxyde_de_carbone
        trend_entity: sensor.maison_bureau_tendance_de_la_temperature
        battery_entity: sensor.maison_bureau_batterie
        connectivity_entity: binary_sensor.maison_bureau_connectivite
        grid_options:
          rows: 2.5
          columns: 6
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--couleur_ombre);
            }
        visibility:
          - condition: screen
            media_query: "(min-width: 768px)"

      - type: custom:netatmo-card
        module_type: indoor_extra
        entity: sensor.maison_sous_sol_temperature
        name: Sous-Sol
        humidity_entity: sensor.maison_sous_sol_humidite
        co2_entity: sensor.maison_sous_sol_dioxyde_de_carbone
        trend_entity: sensor.maison_sous_sol_tendance_de_la_temperature
