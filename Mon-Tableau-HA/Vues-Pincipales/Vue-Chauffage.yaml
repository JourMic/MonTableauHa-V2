title: Chauffage
path: Vue-Chauffages
icon: mdi:radiator
subview: false
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: Salon
        heading_style: title
        icon: mdi:thermometer
        badges:
          - type: entity
            show_state: true
            show_icon: false
            entity: sensor.maison_temperature
            state_content: state
        grid_options:
          columns: 6
          rows: 0.5

      - type: heading
        heading: Sous-Sol
        heading_style: title
        icon: mdi:thermometer
        grid_options:
          columns: 6
          rows: 0.5
        badges:
          - type: entity
            show_state: true
            show_icon: false
            entity: sensor.maison_sous_sol_temperature
            state_content: state

      - type: custom:decluttering-card-plus
        template: statistques
        variables:
          statistques_entity: "sensor.maison_temperature"
          statistques_color: "teal"
          statistques_row: 3
        grid_options:
          columns: 6
          rows: 3

      - type: custom:decluttering-card-plus
        template: statistques
        variables:
          statistques_entity: "sensor.maison_sous_sol_temperature"
          statistques_color: "orange"
          statistques_row: 3
        grid_options:
          columns: 6
          rows: 3

      - type: heading
        icon: mdi:sofa
        heading_style: title
        heading: Salon
        grid_options:
          columns: 6
          rows: 0.5

      - type: heading
        icon: mdi:stove
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.5
        heading: Cusine

      - type: custom:decluttering-card-plus
        template: tuiles_1
        variables:
          - tuile1_entity: "climate.neviweb130_climate_salon"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card-plus
