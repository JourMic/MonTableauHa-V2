title: Sécurité
path: Vue-Securites
icon: mdi:shield-home
subview: false
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading_style: title
        grid_options:
          columns: full
          rows: 0.5
        heading: Caméras
        card_mod:
          style: |
            .content.title {
              font-size: 25px;
            }

      - type: heading
        icon: mdi:home-account
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.5
        heading: Extérieures

      - type: heading
        icon: mdi:tree
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.5
        heading: Intérieures
        
      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "alarm_control_panel.blink_ca_exterieures"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "alarm_control_panel.blink_ca_interieures"
        grid_options:
          columns: 6
          rows: auto

      - type: heading
        heading_style: title
        grid_options:
          columns: full
          rows: 0.6
        heading: Mouvements
        card_mod:
          style: |
            .content.title {
              font-size: 25px;
            }

      - type: heading
        icon: mdi:sofa
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.8
        heading: Salon

      - type: heading
        icon: mdi:home-floor-0
        heading: Cuisine
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.8

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "binary_sensor.camera_salon_mouvement"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "binary_sensor.camera_cuisine_mouvement"
        grid_options:
          columns: 6
          rows: auto

      - type: heading
        icon: mdi:home-floor-0
        heading: Sous-Sol
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.8

      - type: heading
        icon: mdi:home-floor-0
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.8
        heading: Allée

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "binary_sensor.camera_sous_sol_mouvement"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "binary_sensor.camera_allee_mouvement"
        grid_options:
          columns: 6
          rows: auto

      - type: heading
        icon: mdi:gamepad-outline
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.8
        heading: Avant

      - type: heading
        icon: mdi:home-floor-0
        heading_style: title
        grid_options:
          columns: 6
          rows: 0.8
        heading: Arrière

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "binary_sensor.camera_avant_mouvement"
        grid_options:
          columns: 6
          rows: auto

      - type: custom:decluttering-card-plus
        template: alertes
        variables:
          - alertes_entity: "binary_sensor.camera_arriere_mouvement"
        grid_options:
          columns: 6
          rows: auto

  - type: grid
