              columns: 3
              rows: 1.7
          - type: custom:decluttering-card-plus
            template: tuiles_3
            variables:
              - tuile3_entity: light.lecture
              - tuile3_name: Lecture
              - tuile3_icon: mdi:desk-lamp
            grid_options:
              columns: 3
              rows: 1.7
          - type: custom:decluttering-card-plus
            template: tuiles_3
            variables:
              - tuile3_entity: switch.huche_salon
              - tuile3_name: Huche
