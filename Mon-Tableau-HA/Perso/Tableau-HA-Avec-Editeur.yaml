          - type: custom:decluttering-card-plus
            template: tuiles_3
            variables:
              - tuile3_entity: light.neviweb130_lumiere_exterieurs_arriere
              - tuile3_name: Arrière
              - tuile3_icon: hue:ceiling-fugato-two-alt
            grid_options:
              columns: 3
              rows: 1.7
          - type: custom:decluttering-card-plus
            template: tuiles_3
            variables:
              - tuile3_entity: light.salle_a_diner_table
              - tuile3_name: Table
              - tuile3_icon: hue:ensis
            grid_options:
              columns: 3
              rows: 1.7
          - type: custom:decluttering-card-plus
            template: tuiles_3
            variables:
              - tuile3_entity: switch.vestibule_avant
              - tuile3_name: Vestibule
              - tuile3_icon: hue:ceiling-fugato-three-alt
            grid_options:
              columns: 3
              rows: 1.7
      - type: grid
        cards:
          - type: heading
            heading: Calendrier
            icon: mdi:calendar-month-outline
            grid_options:
              columns: full
              rows: 0.3
          - type: custom:calendar-tasks-card
            calendars:
              - calendar.agenda_de_michel
              - calendar.sports_de_michel
              - calendar.anniversaires_de_michel
              - calendar.anniversaires
              - calendar.jours_feries_de_michel
            todos:
              - todo.mes_taches
            title: Agenda de Michel
            event_progress: line
            show_current_date: true
            show_view_switch: true
            show_add_event: false
            show_collapse_button: false
            days: 30
            allow_complete: true
            limit_events_visible: true
            max_events_visible: 2
            compact_mode: true
            grid_options:
              columns: full
              rows: auto
            card_mod:
              style: |
                ha-card {
                  box-shadow: var(--couleur_ombre) !important;
                 }
          - type: heading
            icon: mdi:cctv
            heading: Caméras
            grid_options:
              columns: full
              rows: 0.3
          - type: custom:decluttering-card-plus
            template: tuiles_4
            variables:
              - tuile4_entity: alarm_control_panel.blink_ca_exterieures
            grid_options:
              columns: 6
              rows: auto
          - type: custom:decluttering-card-plus
            template: tuiles_4
            variables:
              - tuile4_entity: alarm_control_panel.blink_ca_interieures
            grid_options:
              columns: 6
              rows: auto
          - type: heading
            icon: mdi:heat-wave
            heading: Chauffage
            entities:
              - show_state: true
                show_icon: true
                entity: sensor.thermopompe_temperature
            grid_options:
              columns: full
              rows: 0.3
          - type: custom:decluttering-card-plus
            template: tuiles_2
            variables:
              - tuile2_entity: climate.sensibo_cuisine
              - tuile2_name: Cuisine
            grid_options:
              columns: 6
              rows: auto
          - type: custom:decluttering-card-plus
            template: tuiles_2
            variables:
              - tuile2_entity: climate.sensibo_salle_de_repos
              - tuile2_name: Salle de repos
            grid_options:
              columns: 6
              rows: auto
          - type: heading
            heading: Environnement Canada Alerte
            heading_style: title
          - type: custom:mod-card
            card_mod:
              style: >
                {% set warn = state_attr('sensor.shawinigan_veilles', 'alert_1')
                | string + " " + state_attr('sensor.sensor.shawinigan_veilles',
                'alert_2') | string %}  {% set watch =
                state_attr('sensor.shawinigan_alertes', 'alert_1') | string + "
                " + state_attr('sensor.shawinigan_alertes', 'alert_2') | string
                %}  {% set adv = state_attr('sensor.shawinigan_avis', 'alert_1')
                | string + " " + state_attr('sensor.shawinigan_avis', 'alert_2')
                | string %}  {% set stat =
                state_attr('sensor.sensor.shawinigan_bulletins', 'alert_1') |
                string + " " + state_attr('sensor.sensor.shawinigan_bulletins',
                'alert_2') | string %}  {% set combined = warn + " " + watch + "
                " + adv + " " + stat %}

                {% if combined and 'None' not in combined or combined | trim !=
                "" %}
                  {% set color = 'red' if 'Red' in combined 
                            else 'orange' if 'Orange' in combined 
                            else 'yellow' if 'Yellow' in combined 
                            else 'grey' if 'Statement' in combined or (stat and 'None' not in stat)
                            else none %}
                  {% set pulse_speed = '1s' if 'Red' in combined 
                                  else '2s' if 'Orange' in combined 
                                  else '3s' if 'Yellow' in combined
                                  else '0s' %}
                  
                  ha-card {
                    {% if color and color != 'grey' %} animation: pulse {{ pulse_speed }} infinite; {% endif %}
                    background: {{ 'rgba(255, 0, 0, 0.2)' if color == 'red' 
                                   else 'rgba(255, 165, 0, 0.2)' if color == 'orange' 
                                   else 'rgba(255, 255, 0, 0.2)' if color == 'yellow' 
                                   else 'rgba(128, 128, 128, 0.2)' if color == 'grey' 
                                   else 'none' }};
                    border: 2px solid {{ color if color else 'transparent' }};
                  }
                  @keyframes pulse {
                    0% { box-shadow: 0 0 0 0px {{ color }}; }
                    70% { box-shadow: 0 0 0 15px rgba(0, 0, 0, 0); }
                    100% { box-shadow: 0 0 0 0px rgba(0, 0, 0, 0); }
                  }
                {% endif %}
            card:
              type: custom:auto-entities
              show_empty: false
              card:
                type: entities
                theme: Dark
                card_mod:
                  style: >
                    ha-card { background: none !important; border: none
                    !important; box-shadow: none !important; font-size: larger
                    !important} .card-content { padding: 8px !important; }
              filter:
                template: |
                  {% set sensors = [
                    'sensor.shawinigan_veilles',
                    'sensor.shawinigan_alertes',
                    'sensor.shawinigan_avis',
                    'sensor.shawinigan_bulletins'
                  ] %}

                  {% set ns = namespace(rows=[]) %}

                  {% for s in sensors %}
                    {% for i in range(1, 5) %}
                      {% set attr = 'alert_' ~ i %}
                      {% set text = state_attr(s, attr) %}
                      {% if text and text != 'None' and text | trim != "" %}
                        
                        {# Define sorting weights: Color first, then Type #}
                        {% set color_prio = 10 if 'Red' in text else 20 if 'Orange' in text else 30 if 'Yellow' in text else 40 %}
                        {% set type_prio = 1 if 'warnings' in s else 2 if 'watches' in s else 3 if 'advisory' in s else 4 %}
                        {% set sort_score = color_prio + type_prio %}

                        {% set row_color = 'red' if 'Red' in text else 'orange' if 'Orange' in text else 'yellow' if 'Yellow' in text else 'grey' %}
                        {% set row_icon = 'mdi:alert' if row_color == 'red' else 'mdi:alert-rhombus' if row_color == 'orange' else 'mdi:alert-circle' if row_color == 'yellow' else 'mdi:alert-box' %}
                        
                        {% set ns.rows = ns.rows + [{
                          "sort_by": sort_score,
                          "type": "attribute",
                          "attribute": "hide_state",
                          "entity": s,
                          "name": text,
                          "icon": row_icon,
                          "tap_action": {
                            "action": "url",
                            "url_path": "https://weather.gc.ca/warnings/report_e.html?onrm26"
                          },
                          "card_mod": {
                            "style": "state-badge { color: " ~ row_color ~ " !important; } :host { --card-mod-icon-color: " ~ row_color ~ "; }"
                          }
                        }] %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}

                  {# This sorts by the combined color + type score #}
                  {{ ns.rows | sort(attribute='sort_by') }}
    badges:
      - type: entity
        entity: sensor.st_00032986_vitesse_du_vent
        name: Vent
        display_type: complete
        tap_action: none
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.shawinigan_sud_sensors_precipitation_today
        name: Pluie
        tap_action:
          action: navigate
          navigation_path: /mon-tableau/Edi-Sous-Vue-Pluie
      - type: custom:lunar-phase-badge
        location_source: default
        entity: sensor.moon_phase
        southern_hemisphere: false
        language: fr
        number_decimals: 2
        mile_unit: false
