      - type: heading
        heading: Imprimante Canon Pro-100
        heading_style: title
        icon: mdi:printer
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.canon_pro_100_series
        grid_options:
          columns: full
          rows: 1

      - type: custom:auto-entities
        card:
          type: grid
          columns: 4
        card_param: cards
        filter:
          include:
            - options:
                type: gauge
                min: 0
                max: 100
                severity:
                  green: 66
                  yellow: 33
                  red: 0
                card_mod:
                  style: |
                    ha-card {
                      box-shadow: var(--couleur_ombre) !important;
                    }
              attributes:
                marker_type: inkCartridge
              domain: sensor
        sort:
          method: state
          numeric: true
        show_empty: false
        grid_options:
          columns: full
          rows: auto